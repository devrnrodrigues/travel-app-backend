spring:
  application:
    name: travelapi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

rapidapi:
  booking:
    base-url: ${RAPIDAPI_BOOKING_URL}
    key: ${RAPIDAPI_KEY}
    host: ${RAPIDAPI_HOST}
